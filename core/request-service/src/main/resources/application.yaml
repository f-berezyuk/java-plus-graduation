spring:
  application:
    name: request-service
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
server:
  port: 9076
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
    hostname: localhost
    instanceId: "${spring.application.name}:${random.value}"
    leaseRenewalIntervalInSeconds: 10

management:
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"  # Открывает все endpoints (для production ограничьте)
      base-path: /actuator
  server:
    port: ${server.port}  # Использует основной порт приложения