spring:
  application:
    name: event-service
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
      fail-fast: true
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  grpc:
    server:
      enabled: false  # Отключаем встроенный сервер
server:
  port: 0
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
    hostname: localhost
    instanceId: "${spring.application.name}:${random.value}"
    leaseRenewalIntervalInSeconds: 10
management:
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"  # Открывает все endpoints (для production ограничьте)
      base-path: /actuator
  server:
    port: ${server.port}  # Использует основной порт приложения
grpc:
  server:
    enabled: false  # Отключаем встроенный сервер
