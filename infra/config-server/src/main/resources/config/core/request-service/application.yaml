spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    driver-class-name: org.postgresql.Driver
    #    url: jdbc:postgresql://ewm-db:5432/ewm-event
    url: jdbc:postgresql://localhost:5432/ewm-request

    username: root
    password: root
  sql:
    init:
      mode: always
feign:
  okhttp:
    enabled=true:
logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.orm.jpa: INFO
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    org.springframework.transaction.interceptor: TRACE
    org.springframework.transaction: INFO

grpc:
  client:
    collector:
      address: 'discovery:///collector'
      enable-keep-alive: true
      keep-alive-without-calls: true
      negotiation-type: plaintext
      enable-retry: true
      retry-attempts: 15
      retry-delay: 3000
  server:
    enabled: false  # Отключаем встроенный сервер
